<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rennes Access Map — Handi-Épiceries</title>
    <style>
        :root {
            --bg-main: #0b0f19;
            --bg-card: #151d30;
            --accent-pmr: #00e676;
            --accent-non-pmr: #ff3d00;
            --text-main: #f0f4f8;
            --text-muted: #64748b;
            --border: rgba(255, 255, 255, 0.08);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        
        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            display: grid;
            grid-template-rows: auto 1fr;
            overflow: hidden;
        }

        header {
            padding: 1rem 2rem;
            background: rgba(21, 29, 48, 0.8);
            backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            font-size: 0.8rem;
            padding: 0.25rem 0.6rem;
            border-radius: 20px;
            background: rgba(0, 230, 118, 0.1);
            color: var(--accent-pmr);
            border: 1px solid var(--accent-pmr);
        }

        .dashboard-container {
            display: grid;
            grid-template-columns: 380px 1fr;
            height: 100%;
            overflow: hidden;
        }

        /* Panneau Latéral (Liste des épiceries) */
        .sidebar {
            background: rgba(21, 29, 48, 0.5);
            border-right: 1px solid var(--border);
            padding: 1.5rem;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .grocery-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 1rem;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .grocery-card:hover, .grocery-card.active {
            border-color: #38bdf8;
            transform: translateY(-2px);
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
        }

        .grocery-card.active {
            background: linear-gradient(135deg, var(--bg-card), rgba(56, 189, 248, 0.05));
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            margin-bottom: 0.5rem;
        }

        .pmr-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
        }
        .pmr-true { background-color: var(--accent-pmr); box-shadow: 0 0 10px var(--accent-pmr); }
        .pmr-false { background-color: var(--accent-non-pmr); box-shadow: 0 0 10px var(--accent-non-pmr); }

        .schedule {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 0.5rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        /* Espace Cartographie Évoluée */
        .map-viewport {
            position: relative;
            background: radial-gradient(circle at center, #1e293b 0%, #0f172a 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        #rennes-svg-map {
            width: 100%;
            height: 100%;
            max-width: 700px;
            max-height: 700px;
            border: 1px dashed rgba(255,255,255,0.1);
            border-radius: 16px;
            background: rgba(0,0,0,0.2);
        }

        .map-node {
            cursor: pointer;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .map-node:hover, .map-node.selected {
            transform: scale(1.4);
        }

        /* Tooltip flottant sur la carte */
        .map-infobox {
            position: absolute;
            bottom: 2rem;
            right: 2rem;
            background: rgba(15, 23, 42, 0.9);
            border: 1px solid #38bdf8;
            padding: 1rem;
            border-radius: 8px;
            backdrop-filter: blur(8px);
            max-width: 300px;
            pointer-events: none;
            opacity: 0;
            transition: opacity 0.3s ease;
        }
    </style>
</head>
<body>

    <header>
        <div>
            <h2>Rennes Data Access</h2>
            <p style="font-size: 0.8rem; color: var(--text-muted);">Indexation géospatiale des commerces PMR</p>
        </div>
        <div class="status-badge">API Status: Operational</div>
    </header>

    <div class="dashboard-container">
        <!-- Sidebar : injectée par JS -->
        <aside class="sidebar" id="sidebar-list">
            <!-- Loader simulation -->
            <p style="color:var(--text-muted)">Interrogation du serveur de données...</p>
        </aside>

        <!-- Zone Carte Interactive -->
        <main class="map-viewport">
            <!-- Carte Vectorielle SVG générée dynamiquement -->
            <svg id="rennes-svg-map" viewBox="0 0 400 400">
                <!-- Simulation de lignes de métro de Rennes pour faire "vrai" -->
                <path d="M 50,200 Q 200,200 350,200" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="4"/>
                <path d="M 200,50 Q 200,200 200,350" fill="none" stroke="rgba(255,255,255,0.05)" stroke-width="4"/>
                
                <!-- Les points d'épiceries (Nodes) seront injectés ici -->
                <g id="map-nodes-group"></g>
            </svg>

            <!-- Boite d'info contextuelle -->
            <div class="map-infobox" id="infobox"></div>
        </main>
    </div>

    <script>
        /**
         * COUCHE LOGICIELLE - MICRO-API INTERNE ET GESTIONNAIRE D'ÉTAT
         */

        // 1. Base de données Mockée (Simule un retour d'API REST au format JSON)
        const MOCK_API_DATABASE = {
            status: 200,
            city: "Rennes",
            timestamp: Date.now(),
            data: [
                {
                    id: "ep-01",
                    name: "L'Épicerie du Mail",
                    address: "Mail François Mitterrand",
                    pmr_accessible: true,
                    hours: { open: "08:30", close: "21:00" },
                    coordinates: { x: 120, y: 180 } // Coordonnées relatives pour notre mini-carte
                },
                {
                    id: "ep-02",
                    name: "Le Panier Sainte-Anne",
                    address: "Place Sainte-Anne",
                    pmr_accessible: false, // Marches à l'entrée
                    hours: { open: "09:00", close: "23:00" },
                    coordinates: { x: 210, y: 110 }
                },
                {
                    id: "ep-03",
                    name: "Alimentation Générale de la Gare",
                    address: "Place de la Gare",
                    pmr_accessible: true, // Plain-pied + porte automatique
                    hours: { open: "07:00", close: "22:00" },
                    coordinates: { x: 240, y: 290 }
                },
                {
                    id: "ep-04",
                    name: "Bio-Rennes Villejean",
                    address: "Cours Kennedy",
                    pmr_accessible: true,
                    hours: { open: "09:00", close: "20:00" },
                    coordinates: { x: 70, y: 90 }
                }
            ]
        };

        // 2. Client API Asynchrone simulé (Fetch Engine)
        class RennesDataAPI {
            static async fetchGroceries() {
                // Simule le délai de transit réseau (0.5 seconde)
                return new Promise((resolve) => {
                    setTimeout(() => {
                        resolve(MOCK_API_DATABASE);
                    }, 500);
                });
            }
        }

        // 3. Core Architecture & Rendu Synchrone de l'UI
        class AppCore {
            constructor() {
                this.groceries = [];
                this.selectedId = null;
            }

            async init() {
                // Appel API
                const response = await RennesDataAPI.fetchGroceries();
                this.groceries = response.data;
                
                // Point de rendu
                this.renderSidebar();
                this.renderMap();
            }

            renderSidebar() {
                const sidebar = document.getElementById('sidebar-list');
                sidebar.innerHTML = ''; // Clear loader

                this.groceries.forEach(store => {
                    const card = document.createElement('div');
                    card.className = `grocery-card ${this.selectedId === store.id ? 'active' : ''}`;
                    card.dataset.id = store.id;
                    
                    card.innerHTML = `
                        <div class="card-header">
                            <h4>${store.name}</h4>
                            <span class="pmr-indicator ${store.pmr_accessible ? 'pmr-true' : 'pmr-false'}"></span>
                        </div>
                        <p style="font-size: 0.85rem; color: var(--text-muted);">${store.address}</p>
                        <div class="schedule">
                            <span>🕒 Horaires :</span>
                            <strong>${store.hours.open} — ${store.hours.close}</strong>
                        </div>
                        <p style="font-size:0.75rem; margin-top:0.5rem; color: ${store.pmr_accessible ? '#00e676' : '#ff3d00'}">
                            ${store.pmr_accessible ? '♿ Accessible PMR' : '⚠️ Non accessible'}
                        </p>
                    `;

                    card.addEventListener('click', () => this.selectStore(store.id));
                    sidebar.appendChild(card);
                });
            }

            renderMap() {
                const group = document.getElementById('map-nodes-group');
                group.innerHTML = ''; // Reset graphique

                this.groceries.forEach(store => {
                    // Création d'un nœud graphique SVG personnalisé pour chaque épicerie
                    const g = document.createElementNS("http://www.w3.org/2000/svg", "g");
                    g.setAttribute("class", `map-node ${this.selectedId === store.id ? 'selected' : ''}`);
                    g.setAttribute("style", `transform-origin: ${store.coordinates.x}px ${store.coordinates.y}px`);
                    g.dataset.id = store.id;

                    // Cercle extérieur (Halo de couleur d'accessibilité)
                    const circleOuter = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    circleOuter.setAttribute("cx", store.coordinates.x);
                    circleOuter.setAttribute("cy", store.coordinates.y);
                    circleOuter.setAttribute("r", this.selectedId === store.id ? "14" : "8");
                    circleOuter.setAttribute("fill", store.pmr_accessible ? "rgba(0, 230, 118, 0.2)" : "rgba(255, 61, 0, 0.2)");
                    
                    // Centre du marqueur
                    const circleInner = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                    circleInner.setAttribute("cx", store.coordinates.x);
                    circleInner.setAttribute("cy", store.coordinates.y);
                    circleInner.setAttribute("r", "5");
                    circleInner.setAttribute("fill", store.pmr_accessible ? varToHex('--accent-pmr') : varToHex('--accent-non-pmr'));

                    g.appendChild(circleOuter);
                    g.appendChild(circleInner);

                    // Événement au clic sur la mini-carte
                    g.addEventListener('click', () => this.selectStore(store.id));
                    group.appendChild(g);
                });
            }

            selectStore(id) {
                this.selectedId = id;
                
                // Re-filtrage graphique global
                this.renderSidebar();
                this.renderMap();
                this.updateInfobox();
            }

            updateInfobox() {
                const infobox = document.getElementById('infobox');
                const store = this.groceries.find(g => g.id === this.selectedId);

                if (!store) {
                    infobox.style.opacity = 0;
                    return;
                }

                infobox.innerHTML = `
                    <h5 style="color:#38bdf8; margin-bottom:0.25rem">${store.name}</h5>
                    <p style="font-size:0.8rem; margin-bottom:0.5rem">${store.address}</p>
                    <p style="font-size:0.75rem">Status d'accès : <strong>${store.pmr_accessible ? 'Conforme' : 'Non Conforme'}</strong></p>
                `;
                infobox.style.opacity = 1;
            }
        }

        // Helper ultra-spécifique pour traduire les variables CSS à la volée dans le SVG
        function varToHex(varName) {
            return varName === '--accent-pmr' ? '#00e676' : '#ff3d00';
        }

        // Bootstrapping de l'application au runtime
        const app = new AppCore();
        document.addEventListener('DOMContentLoaded', () => app.init());
    </script>
</body>
</html>
